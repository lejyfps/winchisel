name: Nightly

# Signed nightly builds of master, tagged vBASE-nightly.YYYYMMDD.N (the scheme
# the in-app updater already understands).
#
# A build happens only when BOTH hold:
#   * a commit on master passed the CI workflow, and
#   * that green commit is newer than the last shipped nightly.
# We build the last GREEN commit (not necessarily master's tip), so a failing or
# running CI never produces a nightly, and a quiet day produces no release.
# Releases created with GITHUB_TOKEN trigger no workflows, so nightlies never
# reach winget.yml (which additionally skips prereleases).
on:
  schedule:
    # 03:17 UTC daily. Off the full hour, when GitHub's scheduler is busiest.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the newest green commit already shipped (e.g. to test the updater). Never builds an OLDER commit."
        type: boolean
        default: false

# Pause scheduled nightlies without touching code: set the repository variable
# PAUSE_NIGHTLY=true (Settings > Secrets and variables > Actions > Variables).
# Manual runs (NIGHTLY_CI.cmd / "Run workflow") still work while paused.

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'schedule' || vars.PAUSE_NIGHTLY != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      sha: ${{ steps.decide.outputs.sha }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether a nightly is due
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Newest successful CI run on master. The runs API does not return a
          # reliable order with the status filter, so sort ourselves.
          since=$(date -u -d '-30 days' +%Y-%m-%d)
          sha=$(gh api \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&created=>=$since&per_page=100" \
            --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .head_sha // ""')
          if [ -z "$sha" ]; then
            echo "No successful CI run on master - nothing to ship."
            echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # GITHUB_TOKEN may not create a tag whose workflow files differ from
          # the default branch (GitHub answers 403 when the release is
          # created). That happens while CI of a newer commit that changed
          # .github/workflows is still running: wait for it instead of
          # building for minutes and failing at the end.
          if ! git diff --quiet "$sha" origin/master -- .github/workflows; then
            echo "::warning::Newest green commit ${sha:0:7} has different workflow files than master; wait until CI of master is green, then run again."
            echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Newest shipped build: the latest nightly or stable tag, by date.
          last_tag=$(git tag -l 'v*' --sort=-creatordate | head -n1)
          if [ -n "$last_tag" ]; then
            last_sha=$(git rev-list -n1 "$last_tag")
            # Never ship an OLDER commit: the updater would offer it as newer
            # (higher date) and users would silently downgrade. Without force
            # the same commit is skipped too (nothing new to ship); with force
            # the same commit may be rebuilt, e.g. to test the updater.
            if [ "$sha" != "$last_sha" ] && git merge-base --is-ancestor "$sha" "$last_sha"; then
              echo "Green commit $sha is older than $last_tag; refusing (even with force)."
              echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$FORCE" != "true" ]; then
              if [ "$sha" = "$last_sha" ]; then
                echo "Green commit $sha is already contained in $last_tag."
                echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              # Docs-only changes since then are not worth a new build.
              code=$(git diff --name-only "$last_sha" "$sha" \
                | grep -v -E '(^|/)[^/]+\.md$|^LICENSE$|^\.github/|^assets/.*\.(png|jpg|gif|svg)$|^docs/' || true)
              if [ -z "$code" ]; then
                echo "Only docs/repo metadata changed since $last_tag; skipping."
                echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            else
              echo "Force requested: building $sha although it matches or is newer than $last_tag."
            fi
          fi

          # Base = next patch after the newest stable tag, so a nightly sorts
          # above the current stable and below the next one.
          stable=$(git tag -l 'v*' | grep -v -- '-' | sed 's/^v//' | sort -V | tail -n1)
          [ -n "$stable" ] || stable=0.0.0
          IFS=. read -r major minor patch _ <<<"$stable"
          base="$major.$minor.$((patch + 1))"

          date=$(date -u +%Y%m%d)
          n=$(git tag -l "v$base-nightly.$date.*" | sed 's/.*\.//' | sort -n | tail -n1)
          n=$(( ${n:-0} + 1 ))
          version="$base-nightly.$date.$n"
          echo "Building v$version from $sha (previous nightly: ${last_tag:-none})."
          {
            echo "should_build=true"
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: true

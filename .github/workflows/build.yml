name: Build Winchisel

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WINCHISEL_PLATFORM_TOOLSET: v143
    steps:
      - uses: actions/checkout@v4

      - uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: cmd
        run: nuget restore Winchisel.sln -PackagesDirectory packages

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build unsigned validation package
        if: github.ref_type != 'tag'
        shell: cmd
        run: call tools\release.cmd 0.0.0 --unsigned

      - name: Restore update signing key
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          UPDATE_KEY_BASE64: ${{ secrets.WINCHISEL_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not $env:UPDATE_KEY_BASE64) { throw 'WINCHISEL_UPDATE_PRIVATE_KEY_BASE64 is not configured' }
          New-Item -ItemType Directory -Force release-keys | Out-Null
          [IO.File]::WriteAllBytes('release-keys/winchisel-update-private.key', [Convert]::FromBase64String($env:UPDATE_KEY_BASE64))

      - name: Build signed production package
        if: github.ref_type == 'tag'
        shell: cmd
        run: call tools\release.cmd %GITHUB_REF_NAME:~1%

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winchisel-${{ github.ref_name }}
          path: release-output/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dir = "release-output/$version"
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes `
            "$dir/Winchisel-Setup-x64.exe" `
            "$dir/Winchisel-Portable-x64.exe" `
            "$dir/release.json" `
            "$dir/release.json.sig"

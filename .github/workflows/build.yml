name: Build Winchisel

on:
  push:
    branches: [master]
    tags: ["v*.*.*", "v*.*.*.*", "v*-nightly.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: cmd
        run: nuget restore src\app\packages.config -PackagesDirectory packages

      # Plain compile check only. Packaging, signing and publishing are
      # maintainer-local (tools\release.cmd) and not part of CI.
      - name: Build App (Release x64)
        shell: cmd
        run: msbuild src\app\Winchisel.App.vcxproj /m /nologo /verbosity:minimal /clp:ErrorsOnly /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /t:Rebuild

      - name: Build Updater (Release x64)
        shell: cmd
        run: msbuild src\updater\Winchisel.Updater.vcxproj /m /nologo /verbosity:minimal /clp:ErrorsOnly /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /t:Rebuild

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Winchisel-${{ github.ref_name }}
          path: out/
          if-no-files-found: error

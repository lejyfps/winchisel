name: Sanitizer Tests

on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    name: AddressSanitizer
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run tests with AddressSanitizer
        shell: cmd
        run: call tools\run_tests_asan.cmd

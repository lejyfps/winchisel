name: Close stale "needs more info" issues

# Only issues a maintainer labelled "needs more info" are affected: nothing is
# marked stale automatically, and pull requests are never touched. A reply from
# anyone removes the label's effect (the issue is updated) and keeps it open.
on:
  schedule:
    - cron: "41 6 * * *" # daily, off the full hour
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: "needs more info"
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          stale-issue-label: "needs more info"
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 7 days after we asked for more information.
            Comment with the missing details and we will reopen.
          operations-per-run: 100

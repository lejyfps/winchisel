name: Release

# Thin dispatcher over build.yml for pushed version tags.
#   v1.2.3 / v1.2.3.4          -> DRAFT release. Review it, then click
#                                 "Publish"; that triggers winget.yml.
#   v1.2.3-nightly.YYYYMMDD.N  -> published prerelease (manual nightly).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.3"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag + version
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            prerelease=false
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::Unsupported tag $TAG (expected v1.2.3, v1.2.3.4 or v1.2.3-nightly.YYYYMMDD.N)"
            exit 1
          fi
          { echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

      # Optional policy (repository variable STABLE_FROM_NIGHTLY=true): a stable
      # tag must point at a commit that already shipped as a nightly, so stable
      # only ever contains code nightly users have run. Off by default.
      - name: Checkout tags for nightly policy
        if: vars.STABLE_FROM_NIGHTLY == 'true' && steps.meta.outputs.prerelease == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a nightly of this commit
        if: vars.STABLE_FROM_NIGHTLY == 'true' && steps.meta.outputs.prerelease == 'false'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          sha=$(git rev-list -n1 "$TAG")
          for t in $(git tag -l 'v*-nightly.*'); do
            if [ "$(git rev-list -n1 "$t")" = "$sha" ]; then
              echo "OK: $TAG matches nightly $t."; exit 0
            fi
          done
          echo "::error::STABLE_FROM_NIGHTLY is on, but ${sha:0:7} never shipped as a nightly. Run NIGHTLY_CI.cmd first, test it, then tag that commit (or unset the variable)."
          exit 1

  build:
    needs: meta
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: refs/tags/${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ needs.meta.outputs.tag }}
      prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
      draft: ${{ needs.meta.outputs.prerelease != 'true' }}

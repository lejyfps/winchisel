name: Microsoft C++ Code Analysis

# MSVC /analyze through MSBuild (the msvc-code-analysis-action only supports
# CMake). Each translation unit writes a *.nativecodeanalysis.sarif next to
# its object file; they are collected and uploaded to Code Scanning.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "38 17 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload SARIF to Code Scanning
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: NuGet/setup-nuget@323ab0502cd38fdc493335025a96c8fdb0edc71f # v2.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Generate solution
        shell: cmd
        run: call tools\generate-solution.cmd

      - name: Restore packages
        shell: cmd
        run: nuget restore Winchisel.sln -PackagesDirectory packages

      # Analysis findings are reported, not fatal: warnings-as-errors is
      # switched off for this run only.
      - name: Build with code analysis
        shell: cmd
        run: >-
          msbuild Winchisel.sln /m /nologo /verbosity:minimal
          /p:Configuration=Release /p:Platform=x64
          /p:RunCodeAnalysis=true
          /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset
          /p:CodeAnalysisTreatWarningsAsErrors=false
          /p:TreatWarningAsError=false

      - name: Collect SARIF
        id: sarif
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sarif | Out-Null
          $i = 0
          Get-ChildItem -Recurse -Filter *.sarif -Path src, out -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\sarif\*" } |
            ForEach-Object { Copy-Item $_.FullName ("sarif\{0:D4}-{1}" -f $i++, $_.Name) }
          Write-Output "Collected $i SARIF file(s)."
          "count=$i" >> $env:GITHUB_OUTPUT

      - name: Upload SARIF to GitHub
        if: steps.sarif.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: sarif
          category: msvc-analysis
